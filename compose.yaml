name: financia-dev

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: financia
      POSTGRES_DB: financia
      POSTGRES_PASSWORD: ${FINANCIA_DB_PASSWORD:?Ejecuta npm run docker:up para preparar la contraseña local}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  api:
    restart: unless-stopped
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      FinanceV2__Enabled: 'true'
      Authentication__SupabaseUrl: ${FINANCIA_SUPABASE_URL:?Configura FINANCIA_SUPABASE_URL en .env}
      Authentication__PublishableKey: ${FINANCIA_SUPABASE_ANON_KEY:?Configura FINANCIA_SUPABASE_ANON_KEY en .env}
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=financia;Username=financia;Password=${FINANCIA_DB_PASSWORD};Maximum Pool Size=20;Timeout=15;Include Error Detail=false
      Cors__Origins__0: http://127.0.0.1:${FINANCIA_DOCKER_WEB_PORT:-8080}
      Cors__Origins__1: http://localhost:${FINANCIA_DOCKER_WEB_PORT:-8080}
      Logging__LogLevel__System.Net.Http.HttpClient.identity: Warning
      Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:${FINANCIA_DOCKER_API_PORT:-5081}:8080'

  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        FINANCIA_SUPABASE_URL: ${FINANCIA_SUPABASE_URL:?Configura FINANCIA_SUPABASE_URL en .env}
        FINANCIA_API_URL: http://127.0.0.1:${FINANCIA_DOCKER_API_PORT:-5081}
        PUBLIC_CONFIG_DIGEST: ${FINANCIA_PUBLIC_CONFIG_DIGEST:?Usa npm run docker:up para preparar la configuración pública}
      secrets:
        - supabase_public_key
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:${FINANCIA_DOCKER_WEB_PORT:-8080}:8080'

volumes:
  postgres-data:

secrets:
  supabase_public_key:
    environment: FINANCIA_SUPABASE_ANON_KEY
